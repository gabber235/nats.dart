name: Resilience

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Seeded 30 minute soak
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.9
          call: soak --duration-seconds=1800 --seed=20260902 stdout
          enable-github-summary: "true"
